<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaultWard — Secure Login</title>
<style>
  :root{
    --teal-dark:#04201c;
    --teal:#0b3d35;
    --teal-glow:#1fd9b0;
    --gold:#f4c542;
    --gold-glow:#ffe08a;
    --white:#eef7f4;
    --muted:#9fc9bf;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI', Roboto, sans-serif;
    background:radial-gradient(circle at 20% 20%, #0c2e29 0%, var(--teal-dark) 55%, #021210 100%);
    overflow:hidden;
    position:relative;
  }
  /* ambient glow particles */
  .glow-orb{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.35;
    animation:float 9s ease-in-out infinite;
  }
  .glow-orb.teal{background:var(--teal-glow);width:280px;height:280px;top:10%;left:8%;}
  .glow-orb.gold{background:var(--gold-glow);width:220px;height:220px;bottom:10%;right:10%;animation-delay:2s;}
  @keyframes float{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-25px);}
  }

  .card{
    position:relative;
    z-index:2;
    width:380px;
    background:rgba(7, 41, 36, 0.65);
    border:1px solid rgba(31, 217, 176, 0.35);
    border-radius:18px;
    padding:40px 36px;
    backdrop-filter:blur(14px);
    box-shadow:
      0 0 25px rgba(31, 217, 176, 0.25),
      0 0 60px rgba(244, 197, 66, 0.08),
      inset 0 0 40px rgba(31, 217, 176, 0.04);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .brand-icon{
    width:34px;height:34px;
    border-radius:8px;
    background:linear-gradient(135deg, var(--teal-glow), var(--gold));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:var(--teal-dark);
    box-shadow:0 0 14px rgba(31,217,176,0.5);
  }
  .brand h1{
    font-size:20px;
    color:var(--white);
    letter-spacing:0.5px;
  }
  .tagline{
    color:var(--muted);
    font-size:13px;
    margin-bottom:30px;
    letter-spacing:0.3px;
  }

  .field{margin-bottom:18px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(159,201,191,0.25);
    border-radius:10px;
    color:var(--white);
    font-size:14px;
    outline:none;
    transition:all 0.25s ease;
  }
  .field input:focus{
    border-color:var(--teal-glow);
    box-shadow:0 0 0 3px rgba(31,217,176,0.15), 0 0 12px rgba(31,217,176,0.35);
  }
  .field input::placeholder{color:rgba(159,201,191,0.4);}

  .row-between{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:var(--muted);
    margin-bottom:24px;
  }
  .row-between a{color:var(--gold);text-decoration:none;}
  .row-between a:hover{text-decoration:underline;}

  .btn-login{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg, var(--teal-glow), #16c79e);
    color:#02211b;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.4px;
    cursor:pointer;
    box-shadow:0 0 18px rgba(31,217,176,0.45);
    transition:transform 0.15s ease, box-shadow 0.25s ease;
  }
  .btn-login:hover{
    transform:translateY(-1px);
    box-shadow:0 0 28px rgba(31,217,176,0.65), 0 0 12px rgba(244,197,66,0.3);
  }
  .btn-login:active{transform:translateY(0);}

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:22px 0;
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(159,201,191,0.2);
  }

  .mfa-note{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--gold);
    background:rgba(244,197,66,0.08);
    border:1px solid rgba(244,197,66,0.25);
    padding:10px 12px;
    border-radius:8px;
  }

  .footer-text{
    text-align:center;
    margin-top:24px;
    font-size:11px;
    color:rgba(159,201,191,0.5);
  }
</style>
</head>
<body>

  <div class="glow-orb teal"></div>
  <div class="glow-orb gold"></div>

  <div class="card">
    <div class="brand">
      <div class="brand-icon">V</div>
      <h1>VaultWard</h1>
    </div>
    <p class="tagline">Encrypted hospital records, accessed only by you.</p>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username or staff ID</label>
        <input type="text" id="username" placeholder="e.g. w.madzorera" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <div class="row-between">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" style="width:auto;accent-color:#1fd9b0;"> Remember device
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login">Sign in securely</button>
    </form>

    <div class="divider">Then verify</div>
    <div class="mfa-note">
      A 6-digit code will be requested from your authenticator app before access is granted.
    </div>

    <p class="footer-text">All sessions are encrypted in transit and logged for audit. Unauthorized access is a criminal offence.</p>
  </div>

</body>
</html>
